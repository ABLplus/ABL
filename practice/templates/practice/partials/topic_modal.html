<!-- practice/partials/topic_modal.html -->
<div class="fixed inset-0 z-50" role="dialog" aria-modal="true">
  <!-- Backdrop (click to close via HTMX) -->
  <div
    class="absolute inset-0 bg-black/50"
    hx-get="{% url 'practice:modal_empty' %}"
    hx-target="#modal-root"
    hx-swap="innerHTML"
    aria-hidden="true"
  ></div>

  <!-- Panel -->
  <div class="relative mx-auto mt-24 w-full max-w-lg rounded-2xl bg-white dark:bg-gray-800 p-6 shadow-xl">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-gray-100">
        {{ topic.name }}
      </h3>

      <!-- Close button (also HTMX-clears modal) -->
      <button
        class="rounded-full p-2 hover:bg-gray-100 dark:hover:bg-gray-700"
        hx-get="{% url 'practice:modal_empty' %}"
        hx-target="#modal-root"
        hx-swap="innerHTML"
        aria-label="Close"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="mt-3 space-y-2">
      

      {% if num_questions %}
        <p class="text-sm text-gray-600 dark:text-gray-400">Total Questions: {{ num_questions }}</p>
      {% endif %}

      <p class="text-sm text-gray-600 dark:text-gray-400">
        {% if topic_summary.total_attempts %}
        No. of Questions attempts(include repeats): {{topic_summary.total_attempts}}
        {% else %}
        No attempts yet. Click Start Practice to begin.
        {% endif %}

      </p>
    </div>

    <!-- Footer -->
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700"
        hx-get="{% url 'practice:modal_empty' %}"
        hx-target="#modal-root"
        hx-swap="innerHTML"
      >Cancel</button>

      <a
        href="{{ practice_url }}"
        class="px-4 py-2 rounded-lg bg-primary-600 text-white hover:bg-primary-700"
      >Start Practice</a>
    </div>
  </div>
</div>
