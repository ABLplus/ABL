<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg w-full max-w-lg p-6">
    <h2 class="text-xl font-bold mb-4">{{ section.name }}</h2>
    <p class="text-gray-600 dark:text-gray-300 mb-6">
      This section has {{ section.topics.count }} topics.
    </p>

    <div class="flex justify-end gap-2">
      <button
        class="px-4 py-2 bg-gray-300 dark:bg-gray-600 rounded"
        onclick="document.getElementById('modal-root').innerHTML = ''">
        Cancel
      </button>

      <form method="post" action="{% url 'practice:create_capsule' %}">
        {% csrf_token %}
        <input type="hidden" name="section" value="{{ section.id }}">
        <button type="submit"
          class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded">
          Start Practice Capsule
        </button>
      </form>
    </div>
  </div>
</div>
