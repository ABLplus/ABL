

<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for subj in subjects %}
    <div class="space-y-2 border rounded dark:border-gray-600 p-3
                bg-gray-50 dark:bg-gray-800">

      {# ── FULL-SUBJECT capsule ── #}
      <button
        
        class="w-full flex justify-between items-center px-3 py-2
               bg-grey-600 hover:bg-grey-700 rounded text-white
               font-semibold text-sm">
        <span>{{ subj.name }}</span>        
      </button>

      {# ── SECTION rows ── #}
      {% for section in subj.sections.all %}
        <a href="{% url 'practice:practice_home' %}"><button       
          class="w-full flex justify-between items-center px-3 py-2
                 bg-white dark:bg-gray-700 rounded text-left shadow-sm">

          <span class="text-gray-800 dark:text-gray-100 truncate">
            {{ section.name }}
          </span>          
        </button></a>
      {% empty %}
        <p class="text-sm text-gray-500 dark:text-gray-400">
          No sections defined.
        </p>
      {% endfor %}
    </div>
  {% endfor %}
</div>
