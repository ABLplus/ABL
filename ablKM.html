    // Lazy D3 loader (UMD). We only fetch it when Sunburst is shown.
    // ──────────────────────────────────────────────────────────────────────────
    function loadD3() {
      return new Promise((resolve, reject) => {
        if (window.d3) return resolve(window.d3);
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
        script.onload = () => resolve(window.d3);
        script.onerror = () => reject(new Error('Failed to load D3'));
        document.head.appendChild(script);
      });
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Seeded RNG for reproducible random CMIs
    // ──────────────────────────────────────────────────────────────────────────
    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Helpers
    // ──────────────────────────────────────────────────────────────────────────
    function assignRandomCMI(node, rng) {
      if (!node.children || node.children.length === 0) {
        const n = Number(rng().toFixed(2));
        node.cmi = Number.isFinite(n) ? n : 0;
      } else {
        node.children.forEach((c) => assignRandomCMI(c, rng));
        const vals = node.children.map((c) => c.cmi).filter((v) => typeof v === 'number' && Number.isFinite(v));
        const mean = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
        node.cmi = Number(mean.toFixed(2));
      }
      return node;
    }

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function bucketFromCMI(cmi, t1, t2) {
      const v = Number.isFinite(cmi) ? cmi : 0;
      if (v >= t2) return 'Known';
      if (v >= t1) return 'In‑Transition';
      return 'Weak';
    }

    function colorFromBucket(bucket) {
      switch (bucket) {
        case 'Known': return '#22c55e';
        case 'In‑Transition': return '#f59e0b';
        default: return '#ef4444';
      }
    }

    function flattenLeaves(node, path = []) {
      const here = [...path, node.name];
      if (!node.children || node.children.length === 0) return [{ path: here, name: node.name, cmi: node.cmi }];
      return node.children.flatMap((c) => flattenLeaves(c, here));
    }

    function downloadCSV(rows, filename = 'kmap_cmi.csv') {
      const header = ['Subject','Section','Topic','CMI'];
      const lines = [header.join(',')];
      for (const r of rows) {
        const [_, subj, sect, ...rest] = r.path;
        const topic = rest.join(' → ') || sect || subj;
        const val = Number.isFinite(r.cmi) ? r.cmi : 0;
        const row = [subj || '', sect || '', topic || '', val];
        const safe = row.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(',');
        lines.push(safe);
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Sunburst (uses global d3 after lazy-load)
    // ──────────────────────────────────────────────────────────────────────────
    function Sunburst({ rootData, thresholds, search }) {
      const ref = useRef(null);
      const { t1, t2 } = thresholds;
      const [status, setStatus] = useState('idle');
      const [err, setErr] = useState('');

      useEffect(() => {
        let cancelled = false;
        async function draw() {
          if (!ref.current) return;
          setStatus('loading'); setErr('');
          try {
            const d3 = await loadD3();
            if (cancelled) return;

            const width = 520, radius = width / 2;
            ref.current.innerHTML = '';

            const root = d3.hierarchy(rootData)
              .sum(d => (!d.children || d.children.length === 0 ? 1 : 0))
              .sort((a,b) => b.value - a.value);
            d3.partition().size([2*Math.PI, radius])(root);

            const bucketColor = (d) => colorFromBucket(bucketFromCMI(Number.isFinite(d.data.cmi) ? d.data.cmi : 0, t1, t2));

            const svg = d3.select(ref.current).append('svg')
              .attr('viewBox', `${-width/2} ${-width/2} ${width} ${width}`)
              .attr('width','100%').attr('height','100%').style('maxHeight','520px');

            const arc = d3.arc()
              .startAngle(d=>d.x0).endAngle(d=>d.x1)
              .innerRadius(d=>d.y0).outerRadius(d=>d.y1-1);

            const g = svg.append('g');

            const tip = d3.select(ref.current).append('div')
              .attr('class','absolute z-10 hidden bg-white/90 dark:bg-gray-800/90 backdrop-blur rounded-xl shadow px-3 py-2 text-sm')
              .style('pointer-events','none');

            function showTip(event, d){
              const [px,py] = d3.pointer(event, svg.node());
              const cmi = Number.isFinite(d.data.cmi) ? d.data.cmi : 0;
              tip.classed('hidden', false)
                .html(`<div class="font-semibold">${d.ancestors().map(a=>a.data.name).reverse().slice(1).join(' → ')}</div>
                       <div class="text-xs opacity-80">CMI: <span class="font-mono">${cmi.toFixed(2)}</span></div>`)
                .style('left', (px+12)+'px').style('top', (py+12)+'px');
            }
            function hideTip(){ tip.classed('hidden', true); }

            const path = g.selectAll('path')
              .data(root.descendants().filter(d=>d.depth>0))
              .join('path')
              .attr('d', arc)
              .attr('fill', d=>bucketColor(d))
              .attr('fill-opacity', d=>d.children?0.8:1)
              .attr('stroke', '#111827').attr('stroke-opacity',0.12)
              .style('cursor','pointer')
              .on('mousemove', showTip)
              .on('mouseleave', hideTip)
              .on('click', clicked);

            const label = g.append('g').attr('pointer-events','none').attr('text-anchor','middle').style('user-select','none')
              .selectAll('text')
              .data(root.descendants().filter(d=>d.depth>0))
              .join('text')
              .attr('transform', d=>labelTransform(d))
              .attr('dy','.32em').attr('class','fill-gray-900 dark:fill-gray-100 text-[10px]')
              .text(d=> (d.x1-d.x0>0.04 ? d.data.name : ''));

            function labelTransform(d){
              const x = (((d.x0+d.x1)/2)*180)/Math.PI; const y=(d.y0+d.y1)/2;
              return `rotate(${x-90}) translate(${y},0) rotate(${x<180?0:180})`;
            }
            function clicked(event,p){
              root.each(d=>{ d.target={
                x0: Math.max(0, Math.min(1, (d.x0-p.x0)/(p.x1-p.x0))) * 2*Math.PI,
                x1: Math.max(0, Math.min(1, (d.x1-p.x0)/(p.x1-p.x0))) * 2*Math.PI,
                y0: Math.max(0, d.y0-p.y0), y1: Math.max(0, d.y1-p.y0)
              }; });
              const t = g.transition().duration(750);
              path.transition(t).attrTween('d', d=>{
                const i=d3.interpolate(d.current||d,d.target);
                return t=> (d.current=i(t), arc(d.current));
              });
              label.filter(d=> d.x1-d.x0>0.03).transition(t).attr('transform', d=>labelTransform(d.target||d));
            }

            if (search && search.trim()){
              const q = search.trim().toLowerCase();
              path.attr('opacity', d => d.data.name.toLowerCase().includes(q)?1:0.25);
            }

            setStatus('ready');
          } catch (e) {
            if (!cancelled) { setErr(e?.message || String(e)); setStatus('error'); }
          }
        }
        draw();
        return ()=>{ cancelled = true; };
      }, [rootData, thresholds, search]);

      return (
        <div className="relative w-full">
          {status==='loading' && <div className="absolute inset-0 grid place-items-center text-xs text-gray-500">Loading visualization…</div>}
          {status==='error' && <div className="absolute inset-0 grid place-items-center text-xs text-red-600">Failed to load D3: {err}</div>}
          <div ref={ref} />
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Tree List
    // ──────────────────────────────────────────────────────────────────────────
    function TreeList({ data, thresholds, search }){
      const { t1, t2 } = thresholds;
      const [open, setOpen] = useState(()=> new Set());
      const q = (search||'').toLowerCase();

      function isOpen(key){ return open.has(key); }
      function toggle(key){ const n = new Set(open); n.has(key) ? n.delete(key) : n.add(key); setOpen(n); }

      const renderNode = (node, path=[], depth=0) => {
        const key = [...path, node.name].join('/');
        const hasChildren = node.children && node.children.length>0;
        const bucket = bucketFromCMI(node.cmi ?? 0, t1, t2);
        const color = colorFromBucket(bucket);
        const match = node.name.toLowerCase().includes(q);
        return (
          <div key={key} className="ml-2">
            <div className={`flex items-center gap-2 py-1.5 rounded-lg px-2 ${match? 'bg-yellow-50 dark:bg-yellow-900/20':''}`}>
              {hasChildren ? (
                <button onClick={()=>toggle(key)} className="w-5 h-5 grid place-items-center rounded border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800" title={isOpen(key)?'Collapse':'Expand'}>
                  {isOpen(key) ? '−' : '+'}
                </button>
              ) : (
                <span className="w-5 h-5 grid place-items-center">🌿</span>
              )}
              <div className="flex-1 min-w-0"><div className="truncate font-medium">{node.name}</div></div>
              <div className="shrink-0 text-xs font-mono px-2 py-0.5 rounded-lg" style={{ background: color+'22', color }} title={`CMI ${Number.isFinite(node.cmi)? node.cmi.toFixed(2):'0.00'}`}>
                {Number.isFinite(node.cmi)? node.cmi.toFixed(2):'0.00'}
              </div>
            </div>
            {hasChildren && isOpen(key) && (
              <div className="ml-4 border-l border-gray-200 dark:border-gray-800 pl-3">
                {node.children.map(c => renderNode(c, [...path, node.name], depth+1))}
              </div>
            )}
          </div>
        );
      };
      return <div className="space-y-1">{data.children.map(c => renderNode(c, [data.name]))}</div>;
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Self‑tests
    // ──────────────────────────────────────────────────────────────────────────
    function runSelfTests(){
      const out=[]; const test=(name,fn)=>{ try{ const res=fn(); out.push({name, pass: res===true, detail: res===true? undefined: String(res)});}catch(e){ out.push({name, pass:false, detail:e?.message||String(e)});} };
      test('Bucket: below T1 ⇒ Weak', ()=> bucketFromCMI(0.39,0.4,0.7)==='Weak');
      test('Bucket: T1 ⇒ In‑Transition', ()=> bucketFromCMI(0.4,0.4,0.7)==='In‑Transition');
      test('Bucket: [T1,T2) ⇒ In‑Transition', ()=> bucketFromCMI(0.55,0.4,0.7)==='In‑Transition');
      test('Bucket: T2 ⇒ Known', ()=> bucketFromCMI(0.7,0.4,0.7)==='Known');
      test('Bucket: above T2 ⇒ Known', ()=> bucketFromCMI(0.95,0.4,0.7)==='Known');
      test('assignRandomCMI: produces finite CMIs', ()=>{ const rng=mulberry32(123); const data=clone(KM_DATA); assignRandomCMI(data, rng); return flattenLeaves(data).every(l=>Number.isFinite(l.cmi)); });
      test('flattenLeaves: returns non‑empty', ()=> flattenLeaves(KM_DATA).length>0);
      return out;
    }

    function SelfTestsPanel({ rerollKey }){
      const results = useMemo(()=> runSelfTests(), [rerollKey]);
      const passCount = results.filter(r=>r.pass).length;
      return (
        <div className="rounded-2xl p-4 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
          <div className="font-semibold mb-3">Self‑tests</div>
          <ul className="space-y-1 text-sm">
            {results.map((r,i)=> (
              <li key={i} className="flex items-center gap-2">
                <span>{r.pass ? '✅' : '❌'}</span>
                <span className="flex-1">{r.name}</span>
                {!r.pass && r.detail && <span className="text-xs text-red-500">{r.detail}</span>}
              </li>
            ))}
          </ul>
          <div className="mt-2 text-xs text-gray-500">{passCount}/{results.length} tests passed.</div>
        </div>
      );
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Main App
    // ──────────────────────────────────────────────────────────────────────────
    function KnowledgeMapApp(){
      const [seed, setSeed] = useState(12345);
      const [thresholds, setThresholds] = useState({ t1: 0.4, t2: 0.7 });
      const [search, setSearch] = useState('');
      const [view, setView] = useState('tree');

      const data = useMemo(()=>{ const rng=mulberry32(seed); const fresh=clone(KM_DATA); assignRandomCMI(fresh, rng); return fresh; }, [seed]);
      const leaves = useMemo(()=> flattenLeaves(data), [data]);
      const summary = useMemo(()=>{ const s={Known:0,'In‑Transition':0,Weak:0}; for (const l of leaves){ s[bucketFromCMI(l.cmi, thresholds.t1, thresholds.t2)]++; } return s; }, [leaves, thresholds]);
      const totalTopics = leaves.length;

      return (
        <div className="p-6 max-w-7xl mx-auto">
          <header className="flex items-center justify-between gap-4 mb-6">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">ABL+ K‑Map with CKB (Standalone)</h1>
              <p className="text-sm text-gray-600 dark:text-gray-400">Seeded random CMI for demo · Adjust thresholds to see boundary shifts</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={()=> setView(view==='sunburst'?'tree':'sunburst')} className="px-3 py-2 rounded-xl bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 text-sm" title="Toggle View">View: {view==='sunburst'?'Sunburst':'Tree'}</button>
              <button onClick={()=> setSeed(s=> s+1)} className="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm" title="Re‑roll CMI">Re‑roll CMI</button>
              <button onClick={()=> downloadCSV(leaves)} className="px-3 py-2 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm" title="Export CSV">Export CSV</button>
            </div>
          </header>

          <section className="grid md:grid-cols-3 gap-4 mb-6">
            <div className="rounded-2xl p-4 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
              <div className="font-semibold mb-3">Search</div>
              <input type="text" value={search} onChange={e=> setSearch(e.target.value)} placeholder="Find a topic…" className="w-full rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-2" />
              <div className="mt-2 text-xs text-gray-500">Highlights matching arcs/nodes.</div>
            </div>

            <div className="rounded-2xl p-4 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
              <div className="font-semibold mb-3">CKB Thresholds</div>
              <label className="block text-xs mb-1">T1 (Weak → In‑Transition) : {thresholds.t1.toFixed(2)}</label>
              <input type="range" min={0} max={0.95} step={0.01} value={thresholds.t1} onChange={e=> { const v=parseFloat(e.target.value); setThresholds(t=> ({...t, t1: Math.min(v, t.t2-0.02)})); }} className="w-full" />
              <label className="block text-xs mt-3 mb-1">T2 (In‑Transition → Known) : {thresholds.t2.toFixed(2)}</label>
              <input type="range" min={0.05} max={1} step={0.01} value={thresholds.t2} onChange={e=> { const v=parseFloat(e.target.value); setThresholds(t=> ({...t, t2: Math.max(v, t.t1+0.02)})); }} className="w-full" />
              <div className="mt-2 text-xs text-gray-500">Default: T1=0.40, T2=0.70</div>
            </div>

            <div className="rounded-2xl p-4 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
              <div className="font-semibold mb-3">CKB Summary</div>
              <ul className="space-y-2 text-sm">
                <li className="flex items-center justify-between"><span className="flex items-center gap-2"><span className="inline-block w-3 h-3 rounded-full" style={{background:'#ef4444'}}></span> Weak</span> <span className="font-semibold">{summary.Weak}</span></li>
                <li className="flex items-center justify-between"><span className="flex items-center gap-2"><span className="inline-block w-3 h-3 rounded-full" style={{background:'#f59e0b'}}></span> In‑Transition</span> <span className="font-semibold">{summary['In‑Transition']}</span></li>
                <li className="flex items-center justify-between"><span className="flex items-center gap-2"><span className="inline-block w-3 h-3 rounded-full" style={{background:'#22c55e'}}></span> Known</span> <span className="font-semibold">{summary.Known}</span></li>
              </ul>
              <div className="mt-3 text-xs text-gray-500">Total topics: {totalTopics}</div>
            </div>
          </section>

          <section className="grid lg:grid-cols-2 gap-6 items-start">
            <div className="rounded-2xl p-4 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
              <div className="flex items-center justify-between mb-3">
                <div className="font-semibold">{view==='sunburst' ? 'Zoomable Sunburst' : 'Collapsible Tree'}</div>
                <div className="text-xs text-gray-500">Click to zoom / expand</div>
              </div>
              {view==='sunburst' ? (
                <Sunburst rootData={data} thresholds={thresholds} search={search} />
              ) : (
                <div className="max-h-[520px] overflow-auto pr-2">
                  <TreeList data={data} thresholds={thresholds} search={search} />
                </div>
              )}
            </div>

            <div className="rounded-2xl p-4 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
              <div className="font-semibold mb-3">Details Panel</div>
              <p className="text-sm text-gray-600 dark:text-gray-400 mb-3">The sunburst colors reflect your <span className="font-medium">Clarity of Knowledge Boundaries</span>: <span className="text-red-500 font-medium">Weak</span> ← <span className="text-amber-500 font-medium">In‑Transition</span> ← <span className="text-green-600 font-medium">Known</span>. Adjust thresholds to explore how boundary shifts reclassify topics.</p>
              <ul className="text-sm space-y-1 max-h-[520px] overflow-auto pr-2">
                {leaves.filter(l=> (search? l.name.toLowerCase().includes(search.toLowerCase()): true)).sort((a,b)=> b.cmi - a.cmi).map((l,i)=>{
                  const bucket = bucketFromCMI(l.cmi, thresholds.t1, thresholds.t2);
                  const color = colorFromBucket(bucket);
                  const [_, subj, sect, ...rest] = l.path;
                  const topic = rest.join(' → ') || sect || subj;
                  return (
                    <li key={i} className="flex items-center gap-3 py-1.5 border-b border-gray-100 dark:border-gray-800">
                      <span className="inline-block w-2 h-2 rounded-full" style={{background: color}}></span>
                      <div className="flex-1 min-w-0">
                        <div className="truncate font-medium">{topic}</div>
                        <div className="text-xs text-gray-500 truncate">{subj} {sect ? `• ${sect}` : ''}</div>
                      </div>
                      <div className="text-xs font-mono px-2 py-0.5 rounded-lg" style={{background: color+'22', color}}>{Number.isFinite(l.cmi)? l.cmi.toFixed(2): '0.00'}</div>
                    </li>
                  );
                })}
              </ul>
            </div>
          </section>

          <section className="grid md:grid-cols-3 gap-4 mt-6">
            <SelfTestsPanel rerollKey={`${seed}-${thresholds.t1}-${thresholds.t2}`} />
          </section>

          <footer className="mt-6 text-xs text-gray-500">Forest metaphor: <span className="font-medium">Subjects</span> = groves, <span className="font-medium">Sections</span> = trees, <span className="font-medium">Topics</span> = leaves 🌿. Color = clarity.</footer>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KnowledgeMapApp />);
  </script>
</body>
</html>
