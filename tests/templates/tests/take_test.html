{% extends 'user/base.html' %}
{% block title %}Take Test{% endblock %}

{% block content %}
<div class="mx-auto mt-4 space-y-4 px-3 sm:px-4 md:px-6
            max-w-3xl md:max-w-4xl lg:max-w-5xl xl:max-w-screen-xl 2xl:max-w-screen-2xl">

  <!-- This wrapper will be swapped by HTMX -->
  <div id="question-area">
    {% include 'tests/partials/_question_area.html' %}
  </div>

  <!-- Spinner shown during swaps -->
  <div id="qa-spinner" class="htmx-indicator fixed top-4 right-4 rounded-md bg-gray-900/80 text-white px-3 py-1 text-sm">
    Loading…
  </div>
</div>
{% endblock %}
