<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Question Bank{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
.markdown h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
.markdown h2 { font-size: 1.25rem; margin-bottom: 0.4rem; }
.markdown h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
.markdown h4,
.markdown h5,
.markdown h6 {
    font-size: 1rem;
    margin-bottom: 0.2rem;
}
.markdown p, .markdown ul, .markdown ol {
    margin-bottom: 0.5rem;
}
.markdown ul {
    padding-left: 1.2rem;
}
.markdown li {
    margin-bottom: 0.2rem;
}
</style>

    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'question:question_list' %}">Question Bank</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<!-- Main Container -->
<main class="container mb-5">
    {% block content %}
    {% endblock %}
</main>

<!-- Bootstrap 5 JS Bundle (for navbar toggle etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
