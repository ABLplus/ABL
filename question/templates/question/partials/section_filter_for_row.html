{% load markdown_extras %}

<select
  name="section"
  id="section-{{ q.id }}"
  class="w-full min-w-0 max-w-full rounded-md border border-gray-300 dark:border-gray-700
         bg-white dark:bg-gray-800 px-2 py-1.5 text-xs focus:outline-none focus:ring-2
         focus:ring-primary-500 overflow-hidden whitespace-nowrap text-ellipsis appearance-none"
  hx-get="{% url 'question:ajax_question_topics' q.id %}"
  hx-trigger="change"
  hx-target="#topic-{{ q.id }}"
  hx-include="closest tr"
>
  <option value="">-- Section --</option>

  {% if sections %}
    {% for sec in sections %}
      <option value="{{ sec.id }}" {% if q.section_id == sec.id %}selected{% endif %}>
        {{ sec.name }}
      </option>
    {% endfor %}
  {% else %}
    {% for sec in q.subject.sections.all %}
      <option value="{{ sec.id }}" {% if q.section_id == sec.id %}selected{% endif %}>
        {{ sec.name }}
      </option>
    {% endfor %}
  {% endif %}
</select>
