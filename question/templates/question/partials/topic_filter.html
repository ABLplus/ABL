<select name="topic"
        class="w-full rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
        hx-get="{% url 'question:ajax_subtopics' %}"
        hx-target="#subtopic-container"
        hx-trigger="change"
        hx-include="this">
  <option value="">— Topic —</option>
  {% for top in topics %}
    <option value="{{ top.id }}" {% if filter_topic == top.id|stringformat:"s" %}selected{% endif %}>
      {{ top.name }}
    </option>
  {% endfor %}
  <option value="none" {% if filter_topic == 'none' %}selected{% endif %}>
    No Topic Assigned
  </option>
</select>
