<form
  hx-post="{% url 'start_test' %}"
  hx-target="body"
  hx-swap="none"
  class="space-y-4"
>
  {% csrf_token %}
  <input type="hidden" name="type" value="section">

  <!-- Subject -->
  <label class="block">
    <span class="text-gray-700 dark:text-gray-300">Section</span>
    <select
      name="section"
      class="mt-1 w-full form-select rounded-lg border-gray-300 dark:bg-gray-800 dark:border-gray-600"
      required>
      {% for s in sections %}
        <option value="{{ s.id }}">{{ s.name }} {{ s.id }}</option>
      {% endfor %}
    </select>
  </label>

  <!-- Action buttons -->
  <div class="flex items-center gap-3 pt-1">
    <!-- Normal in-app start -->
    <button
      type="submit"
      name="attempt_mode"
      value="app"
      class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
      Start Test
    </button>

    <!-- OMR start -->
    <button
      type="submit"
      name="attempt_mode"
      value="omr"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
      Attempt on OMR
    </button>
  </div>
</form>
