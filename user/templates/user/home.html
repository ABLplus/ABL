{% extends "user/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<!-- ─────────── HERO ─────────── -->
<section class="text-center mt-12 mb-16">
  <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 dark:text-gray-100">
    Welcome to <span class="text-primary-600 dark:text-primary-400">ABL+</span>
  </h1>
  <p class="mt-4 text-lg sm:text-xl text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
    Practice smart. Learn better. Test yourself. Know your strengths and weaknesses.
  </p>
</section>

<!-- ─────────── LOGIN CTA ─────────── -->
<section class="flex flex-col items-center space-y-6">
  <a href="{% url 'login' %}"
     class="bg-primary-600 hover:bg-primary-700 text-white font-semibold px-8 py-3 rounded-lg shadow
            transition-transform hover:-translate-y-0.5">
    Log&nbsp;in
  </a>

  <p class="text-gray-700 dark:text-gray-300">
    Don’t have an account?
    <a href="{% url 'register' %}"
       class="text-primary-600 dark:text-primary-400 hover:underline">Register here</a>.
  </p>
</section>

<!-- ─────────── DEMO TEST CTA ─────────── -->
<section class="text-center mt-20">
  <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">
    Just want to try first?
  </h2>

  <a href="#"
     class="border border-gray-400 dark:border-gray-500 text-gray-700 dark:text-gray-200
            px-8 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700/40
            transition-transform hover:-translate-y-0.5">
    Take a Demo Test
  </a>
</section>
{% endblock %}
